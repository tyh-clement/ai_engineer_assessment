server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # Only search requests reach Elasticsearch
    location = /es/cv-transcriptions/_search {
        limit_except POST { deny all; }
        proxy_pass http://10.0.2.10:9200/cv-transcriptions/_search;
    }

    # Everything else under /es/ is blocked
    location /es/ {
        return 403;
    }
}